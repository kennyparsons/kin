name: PR Check

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            api/package-lock.json

      - name: Install web dependencies
        run: (cd web && npm ci)

      - name: Install API dependencies
        run: (cd api && npm ci)

      - name: Build web
        run: (cd web && npm run build)

      - name: TypeScript check (web)
        run: (cd web && npx tsc --noEmit)

      - name: TypeScript check (api)
        run: (cd api && npx tsc --noEmit)

      - name: Comment PR - Build Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Build Validation Passed**\n\nAll builds completed successfully. This PR is ready for review.'
            })

      - name: Comment PR - Build Failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Build Validation Failed**\n\nPlease fix the build errors before merging.'
            })
